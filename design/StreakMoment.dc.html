  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FFD23F; } a:hover { color: #C6F135; }
    * { box-sizing: border-box; }
    @keyframes rays { to { transform: rotate(360deg); } }
    @keyframes slam { 0% { transform: scale(3) rotate(-18deg); opacity: 0; } 55% { transform: scale(0.88) rotate(5deg); opacity: 1; } 78% { transform: scale(1.06) rotate(-2deg); } 100% { transform: scale(1) rotate(-3deg); opacity: 1; } }
    @keyframes riseup { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
    @keyframes blink { 0%,88%,100% { transform: scaleY(1); } 92% { transform: scaleY(0.08); } }
    @keyframes march { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes pop-a { 0% { transform: translate(0,0) scale(0.3) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0; } }
    @keyframes pop-b { 0% { transform: translate(0,0) scale(0.3) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0; } }
    .tapz:active { transform: translate(3px,3px) !important; box-shadow: 0 0 0 #0B0B10 !important; }
  </style>
</helmet>

    <div style="display: flex; gap: 9px; animation: riseup 0.5s 0.5s cubic-bezier(0.2,0.9,0.25,1) both;">

  <div style="position: relative; padding: 0 24px 22px; display: flex; flex-direction: column; gap: 11px; animation: riseup 0.5s 0.6s cubic-bezier(0.2,0.9,0.25,1) both;">

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4D7A","options":["#FF4D7A","#FFD23F","#12D8C5","#A86BFF"],"tsType":"string"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { burst: true, parity: 0 };
  }

  componentDidMount() {
    var self = this;
    this._t = setTimeout(function () { self.setState({ burst: false }); }, 1100);
  }

  componentWillUnmount() {
    clearTimeout(this._t);
  }

  audio() {
    if (this._ac === undefined) {
      var AC = window.AudioContext || window.webkitAudioContext;
      this._ac = AC ? new AC() : null;
    }
    return this._ac;
  }

  // Four-note rising fanfare with a noise "shaker" on top.
  fanfare() {
    var ac = this.audio();
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    var t = ac.currentTime;

    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = i === 3 ? 'sawtooth' : 'square';
      o.frequency.value = f;
      var s = t + i * 0.11;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(i === 3 ? 0.17 : 0.11, s + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, s + (i === 3 ? 0.55 : 0.22));
      o.connect(g).connect(ac.destination);
      o.start(s);
      o.stop(s + 0.6);
    });

    var len = Math.floor(ac.sampleRate * 0.5);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    var src = ac.createBufferSource();
    var hp = ac.createBiquadFilter();
    var g2 = ac.createGain();
    src.buffer = buf;
    hp.type = 'highpass';
    hp.frequency.value = 4200;
    g2.gain.value = 0.1;
    src.connect(hp).connect(g2).connect(ac.destination);
    src.start(t + 0.3);
  }

  renderVals() {
    var self = this;
    var accent = this.props.accent || '#FF4D7A';
    var shades = ['#FFD23F', '#12D8C5', '#FFF6E9', '#C6F135', '#A86BFF', '#22D3EE'];
    var name = this.state.parity ? 'pop-b' : 'pop-a';

    var confetti = [];
    for (var i = 0; i < 20; i++) {
      var ang = (i / 20) * Math.PI * 2;
      var dist = 90 + (i % 5) * 26;
      var size = 9 + (i % 4) * 5;
      confetti.push({
        style: 'position:absolute;width:' + size + 'px;height:' + size + 'px;background:' +
          shades[i % shades.length] + ';border:2.5px solid #0B0B10;border-radius:' +
          (i % 3 === 0 ? '999px' : '3px') + ';--dx:' + Math.round(Math.cos(ang) * dist) +
          'px;--dy:' + Math.round(Math.sin(ang) * dist) + 'px;--rot:' + (i * 53) +
          'deg;animation:' + name + ' 1.05s cubic-bezier(0.12,0.8,0.3,1) both;'
      });
    }

    return {
      accent: accent,
      burst: this.state.burst,
      confetti: confetti,
      again: function () {
        self.fanfare();
        self.setState({ burst: true, parity: self.state.parity ? 0 : 1 });
        clearTimeout(self._t);
        self._t = setTimeout(function () { self.setState({ burst: false }); }, 1100);
      }
    };
  }
}
</script>
