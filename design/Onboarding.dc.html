<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FFD23F; } a:hover { color: #C6F135; }
    * { box-sizing: border-box; }
    @keyframes march { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
    @keyframes blink { 0%,88%,100% { transform: scaleY(1); } 92% { transform: scaleY(0.08); } }
    @keyframes riseup { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .tapz:active { transform: translate(3px,3px) !important; box-shadow: 0 0 0 #0B0B10 !important; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0B10; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'Space Grotesk', system-ui, sans-serif;">

  <div style="position: absolute; inset: 0; pointer-events: none; opacity: 0.34; background-image: radial-gradient(circle at 78% 14%, {{accent}}66, transparent 44%), radial-gradient(circle at 16% 74%, #12D8C555, transparent 44%);"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 26px 16px 8px;">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
      <div style="{{d.style}}"></div>
    </sc-for>
  </div>

  <div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 12px 24px 24px;">

    <svg width="96" height="96" viewBox="0 0 70 70" style="animation: float 4s ease-in-out infinite;">
      <path d="M12 40c0-16 10-27 23-27s23 11 23 27c0 12-9 18-23 18S12 52 12 40Z" fill="{{accent}}" stroke="#0B0B10" stroke-width="3.5"></path>
      <rect x="23" y="29" width="24" height="18" rx="6" fill="#FFF6E9" stroke="#0B0B10" stroke-width="3"></rect>
      <circle cx="35" cy="38" r="5.2" fill="#0B0B10" style="animation: blink 4.2s infinite;"></circle>
      <circle cx="37" cy="36" r="1.7" fill="#FFF6E9"></circle>
      <path d="M26 53c3.5 3.5 14 3.5 17.5 0" stroke="#0B0B10" stroke-width="3" stroke-linecap="round" fill="none"></path>
    </svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="font-family: 'Bungee', Impact, sans-serif; font-size: 32px; line-height: 1.05; color: #FFF6E9; text-align: center; text-shadow: 4px 4px 0 {{accent}};">HOW MANY<br>CALORIES?</div>
      <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13px; font-weight: 500; color: #9C9CB8; text-align: center; max-width: 260px; line-height: 1.5; text-wrap: pretty;">Rough is fine. You can change it any time from your profile.</div>
    </div>

    <div style="position: relative; background: #FFF6E9; border: 4px solid #0B0B10; border-radius: 26px; box-shadow: 7px 7px 0 #0B0B10; padding: 22px 24px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; animation: riseup 0.5s cubic-bezier(0.2,0.9,0.25,1) both;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-family: 'Bungee', Impact, sans-serif; font-size: 62px; color: #0B0B10; line-height: 0.9;">{{kcal}}</span>
        <span style="font-family: 'Bungee', Impact, sans-serif; font-size: 17px; color: {{accent}};">KCAL</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px;">
        <div onClick="{{dec}}" class="tapz" style="width: 56px; height: 56px; border: 4px solid #0B0B10; border-radius: 18px; background: #22D3EE; box-shadow: 4px 4px 0 #0B0B10; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.08s;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0B10" stroke-width="3.6" stroke-linecap="round"><path d="M6 12h12"></path></svg>
        </div>
        <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 11px; font-weight: 700; color: #55556E; letter-spacing: 1.4px;">STEP 50</div>
        <div onClick="{{inc}}" class="tapz" style="width: 56px; height: 56px; border: 4px solid #0B0B10; border-radius: 18px; background: #C6F135; box-shadow: 4px 4px 0 #0B0B10; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.08s;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0B10" stroke-width="3.6" stroke-linecap="round"><path d="M12 6v12"></path><path d="M6 12h12"></path></svg>
        </div>
      </div>

      <div style="display: flex; gap: 7px; flex-wrap: wrap; justify-content: center;">
        <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
          <div onClick="{{p.pick}}" class="tapz" style="{{p.style}}">
            <span style="font-family: 'Bungee', Impact, sans-serif; font-size: 10px; color: #0B0B10;">{{p.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div onClick="{{next}}" class="tapz" style="width: 100%; background: {{accent}}; border: 4px solid #0B0B10; border-radius: 20px; box-shadow: 6px 6px 0 #0B0B10; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: transform 0.08s;">
      <span style="font-family: 'Bungee', Impact, sans-serif; font-size: 19px; color: #0B0B10;">KEEP GOING</span>
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#0B0B10" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"></path><path d="M13 6l6 6-6 6"></path></svg>
    </div>
  </div>

  <div style="position: relative; height: 34px; border-top: 3px solid #0B0B10; background: #FFD23F; overflow: hidden; display: flex; align-items: center;">
    <div style="display: flex; gap: 26px; white-space: nowrap; animation: march 13s linear infinite; font-family: 'Bungee', Impact, sans-serif; font-size: 12px; color: #0B0B10; padding-left: 26px;">
      <span>2 OF 5 ★ ALMOST EATING ★ 2 OF 5 ★ ALMOST EATING ★</span>
      <span>2 OF 5 ★ ALMOST EATING ★ 2 OF 5 ★ ALMOST EATING ★</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F45","options":["#FF9F45","#FF4D7A","#12D8C5","#A86BFF"],"tsType":"string"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kcal: 2000 };
  }

  audio() {
    if (this._ac === undefined) {
      var AC = window.AudioContext || window.webkitAudioContext;
      this._ac = AC ? new AC() : null;
    }
    return this._ac;
  }

  tick(up) {
    var ac = this.audio();
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    var t = ac.currentTime;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(up ? 680 : 450, t);
    o.frequency.exponentialRampToValueAtTime(up ? 940 : 330, t + 0.06);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.11, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + 0.13);
  }

  renderVals() {
    var self = this;
    var accent = this.props.accent || '#FF9F45';
    var k = this.state.kcal;

    var dots = [0, 1, 2, 3, 4].map(function (i) {
      var active = i === 1;
      var done = i < 1;
      return {
        style: 'height:10px;border-radius:999px;border:3px solid #0B0B10;width:' +
          (active ? '34px' : '10px') + ';background:' +
          (active ? accent : done ? '#FFF6E9' : '#2A2A38') + ';'
      };
    });

    var presets = [1600, 2000, 2400].map(function (v) {
      var on = k === v;
      return {
        label: v,
        style: 'min-height:44px;display:flex;align-items:center;justify-content:center;padding:6px 16px;' +
          'border:3px solid #0B0B10;border-radius:999px;cursor:pointer;transition:transform 0.08s;background:' +
          (on ? '#FFD23F' : '#E8E0D2') + ';box-shadow:' + (on ? '3px 3px 0 #0B0B10' : 'none') + ';',
        pick: function () { self.tick(true); self.setState({ kcal: v }); }
      };
    });

    return {
      accent: accent,
      kcal: k,
      dots: dots,
      presets: presets,
      inc: function () { self.tick(true); self.setState({ kcal: k + 50 }); },
      dec: function () { self.tick(false); self.setState({ kcal: Math.max(800, k - 50) }); },
      next: function () { self.tick(true); }
    };
  }
}
</script>
</body>
</html>
